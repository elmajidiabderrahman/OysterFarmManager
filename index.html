<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#087ea4"><link rel="manifest" href="manifest.json">
<title>Oyster Farm Manager</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,Arial;margin:0;background:#f3f8fa;color:#12313b}
header{background:#087ea4;color:white;padding:28px 15px;text-align:center}main{max-width:650px;margin:auto;padding:15px}
.card{background:white;padding:18px;margin:12px 0;border-radius:18px;box-shadow:0 3px 15px #0001}
label{display:block;font-weight:bold;margin:12px 0 6px}input,select,button{width:100%;padding:13px;border-radius:12px;border:1px solid #ccdce1;font-size:16px;box-sizing:border-box}
button{background:#087ea4;color:white;border:0;font-weight:bold;margin-top:15px}.langs{display:flex;gap:7px}.langs button{background:white;color:#12313b;border:1px solid #ccdce1;margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{padding:12px;background:#eef8fb;border-radius:12px;text-align:center}.item small{display:block}.item b{font-size:21px}
#result{margin-top:15px;padding:14px;background:#eaf7fa;border-radius:14px}footer{text-align:center;color:#789;padding:15px;font-size:12px}
</style></head><body>
<header><h1>🦪 Oyster Farm Manager</h1><div id="sub">حساب الجيوب والطاولات حسب مرحلة النمو</div></header>
<main>
<div class="langs"><button onclick="setLang('ar')">العربية</button><button onclick="setLang('fr')">Français</button><button onclick="setLang('en')">English</button></div>
<section class="card">
<h2 id="title">🧮 حساب الاحتياج</h2>
<label id="ol">عدد المحار الحالي</label><input id="o" type="number" value="1000000" min="0">
<label id="ml">نسبة النفوق %</label><input id="m" type="number" value="30" min="0" max="100">
<label id="sl">مرحلة التربية</label>
<select id="s" onchange="stage()"><option value="small">محار صغير — حتى 8000 / جيب</option><option value="grow">مرحلة النمو — أدخل السعة الحالية</option><option value="large">محار كبير — 120 إلى 140 / جيب</option></select>
<div id="capbox" style="display:none"><label id="cl">السعة الحالية للجيب</label><input id="cap" type="number" value="1000" min="1"></div>
<label id="tl">الجيوب في كل طاولة</label><input id="t" type="number" value="5" min="1">
<button onclick="calc()" id="cb">احسب الآن</button><div id="result"></div>
</section>
<section class="card"><h2 id="it">📋 مراحل التربية</h2><p id="info">الصغير حتى 8000 في الجيب. في النمو أدخل السعة الحالية. عند الحجم النهائي 120–140 في الجيب. كل طاولة فيها 5 جيوب.</p></section>
</main><footer>يعمل بدون إنترنت • PWA</footer>
<script>
let L='ar';
const T={
ar:{sub:'حساب الجيوب والطاولات حسب مرحلة النمو',title:'🧮 حساب الاحتياج',ol:'عدد المحار الحالي',ml:'نسبة النفوق %',sl:'مرحلة التربية',cl:'السعة الحالية للجيب',tl:'الجيوب في كل طاولة',cb:'احسب الآن',it:'📋 مراحل التربية',info:'الصغير حتى 8000 في الجيب. في النمو أدخل السعة الحالية. عند الحجم النهائي 120–140 في الجيب. كل طاولة فيها 5 جيوب.',after:'المحار بعد النفوق',lost:'النفوق المتوقع',bags:'الجيوب المطلوبة',tables:'الطاولات المطلوبة',cap:'سعة الجيب',note:'لأن السعة النهائية بين 120 و140، النتيجة نطاق.'},
fr:{sub:'Calcul des poches et tables selon la croissance',title:'🧮 Calcul',ol:"Nombre d'huîtres actuel",ml:'Mortalité %',sl:"Stade d'élevage",cl:'Capacité actuelle de la poche',tl:'Poches par table',cb:'Calculer',it:"📋 Stades d'élevage",info:'Petites jusqu’à 8000/poche. En croissance, saisir la capacité. Final 120–140/poche. 5 poches par table.',after:'Après mortalité',lost:'Mortalité prévue',bags:'Poches nécessaires',tables:'Tables nécessaires',cap:'Capacité/poche',note:'La capacité finale étant 120–140, le résultat est une fourchette.'},
en:{sub:'Calculate pockets and tables by growth stage',title:'🧮 Capacity calculator',ol:'Current oysters',ml:'Mortality %',sl:'Growing stage',cl:'Current pocket capacity',tl:'Pockets per table',cb:'Calculate',it:'📋 Growing stages',info:'Small up to 8,000/pocket. During growth, enter current capacity. Final 120–140/pocket. 5 pockets per table.',after:'After mortality',lost:'Expected mortality',bags:'Pockets needed',tables:'Tables needed',cap:'Pocket capacity',note:'Final capacity is 120–140, so the result is a range.'}
};
function setLang(x){L=x;document.documentElement.lang=x;document.documentElement.dir=x==='ar'?'rtl':'ltr';for(let id of ['sub','title','ol','ml','sl','cl','tl','cb','it','info'])document.getElementById(id).textContent=T[x][id];document.getElementById('s').options[0].textContent=x==='ar'?'محار صغير — حتى 8000 / جيب':x==='fr'?'Petites huîtres — jusqu’à 8000 / poche':'Small oysters — up to 8,000 / pocket';document.getElementById('s').options[1].textContent=x==='ar'?'مرحلة النمو — أدخل السعة الحالية':x==='fr'?'Croissance — saisir la capacité':'Growing stage — enter capacity';document.getElementById('s').options[2].textContent=x==='ar'?'محار كبير — 120 إلى 140 / جيب':x==='fr'?'Grosses huîtres — 120 à 140 / poche':'Large oysters — 120 to 140 / pocket'}
function stage(){document.getElementById('capbox').style.display=document.getElementById('s').value==='grow'?'block':'none'}
function fmt(n){return new Intl.NumberFormat(L==='ar'?'ar-MA':L==='fr'?'fr-FR':'en-US').format(n)}
function calc(){let n=+o.value,m=+document.getElementById('m').value,t=+document.getElementById('t').value,s=document.getElementById('s').value;if(n<0||m<0||m>100||t<1)return;let after=Math.round(n*(1-m/100)),lost=n-after,lo,hi;if(s==='small')lo=hi=8000;else if(s==='large'){lo=120;hi=140}else lo=hi=Math.max(1,+document.getElementById('cap').value);let bl=Math.ceil(after/hi),bh=Math.ceil(after/lo),tl=Math.ceil(bl/t),th=Math.ceil(bh/t);let bags=bl===bh?fmt(bl):fmt(bl)+' – '+fmt(bh),tables=tl===th?fmt(tl):fmt(tl)+' – '+fmt(th);result.innerHTML='<div class="grid"><div class="item"><small>'+T[L].after+'</small><b>'+fmt(after)+'</b></div><div class="item"><small>'+T[L].lost+'</small><b>'+fmt(lost)+'</b></div><div class="item"><small>'+T[L].bags+'</small><b>'+bags+'</b></div><div class="item"><small>'+T[L].tables+'</small><b>'+tables+'</b></div><div class="item"><small>'+T[L].cap+'</small><b>'+fmt(lo)+(lo!==hi?' – '+fmt(hi):'')+'</b></div></div>'+(s==='large'?'<p>'+T[L].note+'</p>':'')}
setLang('ar');stage();calc();
</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js')</script></body></html>
